name = "streetbuddy"
main = "src/index.ts"
compatibility_date = "2026-11-01"

# Workers AI (plate recognition), no API key needed
[ai]
binding = "AI"

# D1: drafts, caches, limit counters, report log
[[d1_databases]]
binding = "DB"
database_name = "streetbuddy"
database_id = "77d5ecdb-e082-43e1-b4b7-de039a510f2f"

# Nightly statistics and daily form check: Cloudflare cron runs in UTC; the statistics run only when
# it is 3:00 in Dublin and the form check only when it is 6:00 in Dublin
[triggers]
crons = ["0 2 * * *", "0 3 * * *", "0 5 * * *", "0 6 * * *"]

# Address of this Worker; the bot builds the links to the manual and the installation guide from it.
# It goes into an HTML link as it is, so it must not contain & < > or quotes.
[vars]
SITE_URL = "https://streetbuddy.youmusthavebeen.workers.dev"

# Secrets (set with `wrangler secret put`, not stored here): TELEGRAM_BOT_TOKEN, WEBHOOK_SECRET,
# OWNER_TELEGRAM_ID, GROUP_ID

# Lets src/core import config/area.geojson as text
[[rules]]
type = "Text"
globs = ["**/*.geojson"]
fallthrough = true

# Lets src/install.ts serve userscript/streetbuddy.user.js as text
[[rules]]
type = "Text"
globs = ["**/*.user.js"]
fallthrough = true
